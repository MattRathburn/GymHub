<mat-toolbar color="primary">
    <span>Gym Hub</span>
    <span class="spacer"></span>
    <span>
        <a routerLink="/">Home</a>
        <a routerLink="/about">About</a>
        <a routerLink="/services">Services</a>
        <a routerLink="/contact">Contact</a>
        <a routerLink="/plans" *kaHasRoles="['view-plans']">My Plans</a>
        </span>
        <span>
    <div class="navbar-actions">
        @if( !authenticated ) {
            <button mat-button color="primary" (click)="login()">Login</button>
            <button mat-button color="accent" (click)="signup()">Sign Up</button>
        } @else {
            <button mat-button color="primary" (click)="logout()">Logout</button>
        }

    </div>
    </span>
</mat-toolbar>
